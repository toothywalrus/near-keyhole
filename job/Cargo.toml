[package]
name = "keyhole-pnl-job"
description = "The attested path: a wasm32-wasip2 job that reads a trader's journal, opens one epoch and prints its PnL. Runs locally under wasmtime; OutLayer's hosted run needs a public wasm URL"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# Built on stable (wasm32-wasip2 lives there): cargo build --release --target wasm32-wasip2
[dependencies]
keyhole-core = { path = "../contracts/core", features = ["sha2"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
