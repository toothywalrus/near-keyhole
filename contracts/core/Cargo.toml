[package]
name = "keyhole-core"
description = "Keyhole's pure logic, shared by the contract and the attested job: GGM window keys, the Merkle commitment, entry encryption, the PnL replay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# The sha2 crate as the hash, for anything not running inside NEAR.
sha2 = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", optional = true, default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
serde_json = "1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(kani)']
